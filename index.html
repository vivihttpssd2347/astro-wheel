
<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport"content="width=device-width, initial-scale=1.0, user-scalable=no"> <title>Астрологическое Колесо Прогнозов</title> <style> body { margin: 0; padding: 0; background: #0d0b21; color: #fff; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; } h1 { font-size: 1.4rem; margin-bottom: 20px; text-align: center; color: #e0dbff; text-shadow: 0 0 10px rgba(162, 142, 255, 0.5); } .wheel-container { position: relative; width: 320px; height: 320px; } .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #ffdd67; z-index: 10; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); } canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 25px rgba(162, 142, 255, 0.3), inset 0 0 20px rgba(0,0,0,0.6); transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); } .spin-btn { margin-top: 30px; padding: 12px 35px; font-size: 1.1rem; font-weight: bold; color: #0d0b21; background: linear-gradient(45deg, #ffdd67, #ffb834); border: none; border-radius: 25px; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 184, 52, 0.4); transition: 0.2s; } .spin-btn:disabled { background: #555; color: #aaa; box-shadow: none; cursor: not-allowed; } #result { margin-top: 25px; font-size: 1.2rem; font-weight: 600; text-align: center; max-width: 80%; min-height: 50px; color: #ffdd67; } </style> </head> <body> <h1>✨ Колесо Звездных Прогнозов ✨</h1> <div class="wheel-container"> <div class="pointer"></div> <canvas id="wheel" width="400"height="400"></canvas> </div> <button class="spin-btn" id="spinBtn" onclick="spin()">Испытать удачу</button> <div id="result"></div> <script> const sectors = [ { label: "Успех в делах", color: "#2a1b4e" }, { label: "Новое знакомство", color: "#3b2667" }, { label: "Будь осторожен", color: "#1f1235" }, { label: "Денежный прилив", color: "#2a1b4e" }, { label: "Время отдыха", color: "#3b2667" }, { label: "Удачный день", color: "#1f1235" }, { label: "Доверяй интуиции", color: "#2a1b4e" }, { label: "Яркие эмоции", color: "#3b2667" } ]; const canvas = document.getElementById("wheel"); const ctx = canvas.getContext("2d"); const spinBtn = document.getElementById("spinBtn"); const resultDiv = document.getElementById("result"); const numSectors = sectors.length; const arc = 2 * Math.PI / numSectors; let currentAngle = 0; // Рисуем колесо function drawWheel() { ctx.clearRect(0, 0, 400, 400); for (let i = 0; i < numSectors; i++) { const angle = i * arc; ctx.fillStyle = sectors[i].color; ctx.beginPath(); ctx.moveTo(200, 200); ctx.arc(200, 200, 190, angle, angle + arc); ctx.lineTo(200, 200); ctx.fill(); ctx.strokeStyle = "#4a3b70"; ctx.lineWidth = 2; ctx.stroke(); // Текст секторов ctx.save(); ctx.translate(200, 200); ctx.rotate(angle + arc / 2); ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif"; ctx.textAlign = "right"; ctx.fillText(sectors[i].label, 170, 5); ctx.restore(); } } drawWheel(); function spin() { spinBtn.disabled = true; resultDiv.innerText = ""; // Случайное число оборотов + случайный сектор const spins = 5 + Math.floor(Math.random() * 5); const randomDegrees = Math.floor(Math.random() * 360); const totalRotation = (spins * 360) + randomDegrees; canvas.style.transform = `rotate(${totalRotation}deg)`; setTimeout(() => { // Вычисляем выигравший сектор (с учетом стрелки наверху) const normalizedAngle = (360 - (totalRotation % 360) + 270) % 360; const sectorIndex = Math.floor(normalizedAngle / (360 / numSectors)) % numSectors; resultDiv.innerText = `🔮 Ваш прогноз: ${sectors[sectorIndex].label}!`; spinBtn.disabled = false; }, 4000); } </script> </body> </html>
