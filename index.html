<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport"content="width=device-width, initial-scale=1.0, user-scalable=no"> <title>Колесо Удачи: Прогноз дня</title> <style> body { margin: 0; padding: 0; background: #0f172a; color: #ffffff; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; } .container { text-align: center; position: relative; width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; } h1 { font-size: 24px; margin-bottom: 10px; color: #f1f5f9; text-shadow: 0 0 10px rgba(147, 51, 234, 0.5); } .subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 30px; } .wheel-wrapper { position: relative; width: 320px; height: 320px; margin: 0 auto; } .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #ef4444; z-index: 10; filter: drop-shadow(04px 6px rgba(0,0,0,0.3)); } canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 0 25px rgba(147, 51, 234, 0.3), inset 0 0 20px rgba(0,0,0,0.6); transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); } .spin-btn { margin-top: 40px; padding: 15px 40px; font-size: 18px; font-weight: bold; color: #ffffff; background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%); border: none; border-radius: 50px; cursor: pointer; box-shadow: 04px 15px rgba(147, 51, 234, 0.4); transition: transform 0.2s, opacity 0.2s; -webkit-tap-highlight-color: transparent; } .spin-btn:active { transform: scale(0.95); } .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; } .popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; z-index: 100; } .popup.active { opacity: 1; pointer-events: auto; } .popup-content { background: #1e293b; padding: 30px; border-radius: 24px; text-align: center; max-width: 300px; width: 80%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #334155; transform: scale(0.8); transition: transform 0.5s ease; } .popup.active .popup-content { transform: scale(1); } .popup-title { font-size: 20px; color: #c084fc; margin-bottom: 15px; font-weight: bold; } .popup-text { font-size: 16px; line-height: 1.5; color: #e2e8f0; margin-bottom: 25px; } .popup-btn { padding: 10px 25px; background: #334155; color: #ffffff; border: none; border-radius: 12px; cursor: pointer; font-weight: 600; } </style> </head> <body> <divclass="container"> <h1>Колесо Фортуны</h1> <div class="subtitle">Узнайте, что приготовили вам звезды сегодня</div> <div class="wheel-wrapper"> <div class="pointer"></div> <canvasid="wheel" width="400" height="400"></canvas> </div> <button class="spin-btn"id="spinBtn">Крутить колесо</button> </div> <div class="popup" id="popup"> <div class="popup-content"> <div class="popup-title">✨ Ваш прогноз ✨</div> <div class="popup-text"id="predictionText">Текст прогноза...</div> <button class="popup-btn"id="closeBtn">Отлично</button> </div> </div> <script> const predictions = [ "Прекрасный день для финансов! Возможны неожиданные поступления.", "Звезды советуют отдохнуть. Не перегружайте себя заботами.", "Вас ждет приятный сюрприз или неожиданное знакомство!", "Уделите время близким — сегодня им очень нужна ваша поддержка.", "Интуиция вас не подведет. Смело принимайте важные решения.", "День будет полон энергии. Отличное время для новых начинаний!","Будьте внимательны к деталям, чтобы не упустить важный шанс.", "Сегодня идеальный день, чтобы побаловать себя чем-то приятным." ]; const colors = ["#7c3aed", "#4f46e5", "#2563eb", "#0284c7", "#0d9488", "#059669", "#16a34a", "#ca8a04"]; const canvas = document.getElementById("wheel"); const ctx = canvas.getContext("2d"); const spinBtn = document.getElementById("spinBtn"); const popup = document.getElementById("popup"); const predictionText = document.getElementById("predictionText"); const closeBtn = document.getElementById("closeBtn"); const size = canvas.width; const center = size / 2; const radius = center - 10; const totalSectors = predictions.length; const arc = Math.PI / (totalSectors / 2); let currentAngle = 0; function drawWheel() { ctx.clearRect(0, 0, size, size); for (let i = 0; i < totalSectors; i++) { const angle = currentAngle + i * arc; ctx.fillStyle = colors[i % colors.length]; ctx.beginPath(); ctx.moveTo(center, center); ctx.arc(center, center, radius, angle, angle + arc); ctx.lineTo(center, center); ctx.fill(); ctx.stroke(); // Добавляем текст на сектора (номера или короткие знаки) ctx.save(); ctx.fillStyle = "#ffffff"; ctx.translate(center, center); ctx.rotate(angle + arc / 2); ctx.font = "bold 24px sans-serif"; ctx.textAlign = "right"; ctx.fillText("✨", radius - 30, 10); ctx.restore(); } } drawWheel(); spinBtn.addEventListener("click", () => { spinBtn.disabled = true; // Выбираем случайный сектор const prizeIndex = Math.floor(Math.random() * totalSectors); // Считаем угол вращения (минимум 5 полных оборотов + смещение на сектор) const spins = 5; const targetAngle = (totalSectors - prizeIndex) * arc - (arc / 2); const finalRotation = (spins * 2 * Math.PI) + targetAngle - (currentAngle % (2 * Math.PI)); let start = null; const duration = 4000; // 4 секунды анимации const startAngle = currentAngle; function animate(timestamp) { if (!start) start = timestamp; const progress = timestamp - start; const time = Math.min(progress / duration, 1); // Функция плавного замедления (easeOutCubic) const easeOut = 1 - Math.pow(1 - time, 3); currentAngle = startAngle + finalRotation * easeOut; canvas.style.transform = `rotate(${currentAngle * (180/ Math.PI)}deg)`; if (time < 1) { requestAnimationFrame(animate); } else { setTimeout(() => { predictionText.innerText = predictions[prizeIndex]; popup.classList.add("active"); }, 300); } } requestAnimationFrame(animate); }); closeBtn.addEventListener("click", () => { popup.classList.remove("active"); spinBtn.disabled = false; }); </script> </body> </html>
